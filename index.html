<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salem Zealots – tilastot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="otsikko">Salem Zealots</h1>
    <select id="kausi" aria-label="Kausi"></select>
    <span id="tilanne"></span>
  </header>
  <main>
    <p id="virhe" class="virhe"></p>
    <section id="yhteenveto" class="kortit" data-osio="yhteenveto"></section>

    <h2 data-osio="joukkue">Joukkue</h2>
    <section id="joukkue" data-osio="joukkue"></section>

    <h2>Pistepörssi</h2>
    <section id="pelaajat"></section>

    <h2 data-osio="maalivahdit">Maalivahdit</h2>
    <section id="maalivahdit" data-osio="maalivahdit"></section>

    <h2 data-osio="ottelut">Ottelut</h2>
    <section id="ottelut" data-osio="ottelut"></section>
  </main>
  <footer>
    O = ottelut, M = maalit, S = syötöt, P = pisteet, J = jäähyminuutit,
    C = kapteeni, A = varakapteeni,
    /O = per ottelu. Vie hiiri sarakeotsikon päälle nähdäksesi selitteen.
  </footer>
  <script src="data/tilastot.js"></script>
  <script src="app.js"></script>
</body>
</html>
